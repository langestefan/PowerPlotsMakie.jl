name: Lint

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - name: Build package (required for ExplicitImports)
        uses: julia-actions/julia-buildpkg@v1
      # The julia-formatter hook runs `julia -e 'import JuliaFormatter'` against the
      # default environment, so JuliaFormatter has to be installed there. Pin it: a
      # different minor version formats differently, and the committed code is formatted
      # by whatever developers run locally through prek.
      - name: Install lint tools
        run: |
          using Pkg
          Pkg.add("ExplicitImports")
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = v"2.12.4"))
        shell: julia --color=yes {0}
      - name: Run prek
        uses: j178/prek-action@v3.0.0
        env:
          SKIP: no-commit-to-branch

  link-checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --config '.lychee.toml' .
