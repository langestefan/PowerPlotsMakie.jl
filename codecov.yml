# See https://docs.codecov.com/docs/codecovyml-reference for details
coverage:
  status:
    project:
      default:
        target: 90%
    patch:
      default:
        target: 90%
  range: "80...90" # Yellow within this range
ignore:
  # The precompile workload runs while the package precompiles, which coverage never sees.
  - "src/precompile.jl"
